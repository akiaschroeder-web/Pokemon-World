<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"name=viewport><meta content=yes name=apple-mobile-web-app-capable><meta content=yes name=mobile-web-app-capable><meta content=black name=apple-mobile-web-app-status-bar-style><meta content="Pokémon World"name=apple-mobile-web-app-title><meta content=#14161c name=theme-color><title>Pokémon World</title><style>:root{--bg:#14161c;--btn:#2a2e3a;--btn-down:#4a5166;--text:#d8dbe4;--accent:#c8424a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body,html{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px -apple-system,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#screen-wrap{width:100%;display:flex;justify-content:center;padding-top:8px}#screen{width:min(100vw,calc((100vh - 260px) * 1.5),960px);aspect-ratio:3/2;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;display:block}#screen-stack{position:relative}#screen3d{position:absolute;inset:0;width:100%;height:100%;display:none}#screen-stack.three-d #screen3d{display:block}#screen-stack.demo #screen{opacity:0}#screen-stack.three-d #screen{background:0 0;position:relative}#status{min-height:18px;margin:4px 0;font-size:12px;opacity:.7}.pad{flex:1;width:100%;max-width:520px;position:relative}.btn{position:absolute;background:var(--btn);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--text);box-shadow:0 2px 0 #0008}.btn.down{background:var(--btn-down);transform:translateY(1px);box-shadow:none}.dpad{position:absolute;left:16px;top:34px;width:150px;height:150px}.dpad .btn{border-radius:8px;width:50px;height:50px}.dpad [data-key=UP]{left:50px;top:0}.dpad [data-key=DOWN]{left:50px;top:100px}.dpad [data-key=LEFT]{left:0;top:50px}.dpad [data-key=RIGHT]{left:100px;top:50px}.dpad .diag{background:0 0;box-shadow:none;width:50px;height:50px}.dpad [data-key="UP LEFT"]{left:0;top:0}.dpad [data-key="UP RIGHT"]{left:100px;top:0}.dpad [data-key="DOWN LEFT"]{left:0;top:100px}.dpad [data-key="DOWN RIGHT"]{left:100px;top:100px}[data-key="A"]{right:18px;top:48px;width:66px;height:66px;background:var(--accent);font-size:20px}[data-key="B"]{right:96px;top:96px;width:62px;height:62px;font-size:20px}[data-key="L"],[data-key="R"]{top:0;width:82px;height:30px;border-radius:8px}[data-key="L"]{left:16px}[data-key="R"]{right:16px}[data-key=SELECT],[data-key=START]{bottom:18px;width:74px;height:28px;border-radius:14px;font-size:12px}[data-key=SELECT]{left:calc(50% - 84px)}[data-key=START]{left:calc(50% + 10px)}#menu{margin:4px 0;z-index:5}#menu button,#menu label{background:var(--btn);color:var(--text);border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;margin-left:4px;cursor:pointer}#menu input{display:none}@media (orientation:landscape) and (max-height:600px){#app{flex-direction:row;justify-content:center}#screen-wrap{order:2;width:auto;height:100%;align-items:center;padding:0}#screen{height:min(100vh,calc((100vw - 340px)/ 1.5));width:auto}.pad{position:absolute;inset:0;max-width:none;pointer-events:none}.pad .btn,.pad .dpad{pointer-events:auto}.dpad{top:auto;bottom:30px;left:10px}[data-key="A"]{top:auto;bottom:90px;right:14px}[data-key="B"]{top:auto;bottom:40px;right:90px}[data-key="L"]{top:10px;left:10px}[data-key="R"]{top:10px;right:10px}[data-key=SELECT]{left:10px;bottom:auto;top:50px}[data-key=START]{left:auto;right:10px;bottom:auto;top:50px}#status{position:absolute;bottom:2px}#menu{top:auto;bottom:6px;right:50%;transform:translateX(50%)}}@media (hover:hover) and (pointer:fine){.pad{display:none}#screen{width:min(100vw,calc((100vh - 60px) * 1.5),960px)}}</style></head><body><div id=app><div id=screen-wrap><div id=screen-stack><canvas id=screen3d></canvas><canvas id=screen height=160 width=240></canvas></div></div><div id=status>Loading…</div><div id=menu><button onclick=Module.pwExportSave()>Export save</button> <label>Import save<input accept=.sav,application/octet-stream onchange='this.files[0]&&confirm("Replace your current save with this file?")&&Module.pwImportSave(this.files[0])'type=file></label></div><div class=pad><div class=btn data-key=L>L</div><div class=btn data-key=R>R</div><div class=dpad><div class="btn diag"data-key="UP LEFT"></div><div class=btn data-key=UP>▲</div><div class="btn diag"data-key="UP RIGHT"></div><div class=btn data-key=LEFT>◀</div><div class=btn data-key=RIGHT>▶</div><div class="btn diag"data-key="DOWN LEFT"></div><div class=btn data-key=DOWN>▼</div><div class="btn diag"data-key="DOWN RIGHT"></div></div><div class=btn data-key=B>B</div><div class=btn data-key=A>A</div><div class=btn data-key=SELECT>SELECT</div><div class=btn data-key=START>START</div></div></div><script>var Module={canvas:document.getElementById("screen"),setStatus:function(t){document.getElementById("status").textContent=t},onRuntimeInitialized:function(){document.getElementById("status").textContent="Keyboard: arrows, Z = A, X = B, Enter = Start, Backspace = Select, A/S = L/R"},pwOnSaved:function(){var t=document.getElementById("status"),e=t.textContent;t.textContent="Saved in this browser.",setTimeout((function(){t.textContent=e}),1500)}}</script><script src=unova3d.js></script><script src=index.js async></script></body></html>
