name: Build web version

# Builds the browser version of the game and publishes it on GitHub Pages.
# Runs when a pushed commit's message contains [web], or from "Run workflow".
# After building, it opens the game in a headless browser, presses a few buttons
# and saves screenshots to the web-screenshots branch, as a quick check.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[web]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 200 # to tell which files changed since the cached build

      # Reuse the previous build: everything the build generates (objects, converted
      # graphics, tools) is kept between runs, so only what changed is rebuilt.
      - name: Restore the previous build
        uses: actions/cache/restore@v4
        with:
          path: /tmp/build-cache
          key: web-build-${{ github.sha }}
          restore-keys: web-build-

      - name: Unpack the previous build
        run: |
          if [ -f /tmp/build-cache/build.tar ] && git cat-file -e "$(cat /tmp/build-cache/sha)^{commit}" 2>/dev/null; then
            old=$(cat /tmp/build-cache/sha)
            # Sources count as old, generated files keep their times, and files changed
            # since the cached build count as new, so make rebuilds just those.
            git ls-files -z | xargs -0 touch -h -d 2000-01-01
            tar -xf /tmp/build-cache/build.tar
            git diff --name-only -z "$old" HEAD | xargs -0 -r touch -h 2>/dev/null || true
            echo "Reusing the build of $old ($(git diff --name-only "$old" HEAD | wc -l) files changed)"
          else
            echo "No usable previous build; building everything."
          fi

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpng-dev python3 binutils

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Build
        env:
          GAME_VERSION: EMERALD
        run: |
          set -o pipefail
          make -j$(nproc) PLATFORM=web web 2>&1 | tee build.log
          ls -la build/web/site

      - name: Keep the build for next time
        if: success()
        run: |
          rm -rf /tmp/build-cache && mkdir -p /tmp/build-cache
          git ls-files -z -o -i --exclude-standard | grep -zv '^node_modules/\|^screenshots/\|^build.log$' | tar --null -T - -cf /tmp/build-cache/build.tar
          git rev-parse HEAD > /tmp/build-cache/sha
          ls -la /tmp/build-cache

      - name: Save the build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: /tmp/build-cache
          key: web-build-${{ github.sha }}

      - name: Show build errors
        if: failure()
        run: grep -E "error|undefined symbol" build.log | head -200 || true

      - name: Check it runs
        if: success()
        timeout-minutes: 15
        run: |
          cd build/web/site
          python3 -m http.server 8000 > /dev/null 2>&1 &
          cd "$GITHUB_WORKSPACE"
          npm install --no-save playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          timeout 600 node tools/web/smoke_test.js http://localhost:8000/ screenshots || echo "smoke test stopped ($?)"

      - name: Save screenshots (and the built site) to the web-screenshots branch
        if: always()
        run: |
          sha=$(git rev-parse --short HEAD)
          rm -rf /tmp/shots && mkdir -p /tmp/shots && cd /tmp/shots
          git init -q && git checkout -q -b web-screenshots
          cp -r "$GITHUB_WORKSPACE/screenshots" . 2>/dev/null || mkdir screenshots
          grep -E "error|warning: incompatible|undefined symbol" "$GITHUB_WORKSPACE/build.log" | head -300 > build-errors.txt || true
          if [ -d "$GITHUB_WORKSPACE/build/web/site" ]; then cp -r "$GITHUB_WORKSPACE/build/web/site" site; fi
          git add -A
          git -c user.name="web build" -c user.email="actions@users.noreply.github.com" commit -qm "Screenshots of ${sha}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web-screenshots

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
