name: Build web version

# Builds the browser version of the game and publishes it on GitHub Pages.
# Runs when a pushed commit's message contains [web], or from "Run workflow".
# After building, it opens the game in a headless browser, presses a few buttons
# and saves screenshots to the web-screenshots branch, as a quick check.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[web]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpng-dev python3 binutils

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Build
        env:
          GAME_VERSION: EMERALD
        run: |
          set -o pipefail
          make -j$(nproc) PLATFORM=web web 2>&1 | tee build.log
          ls -la build/web/site

      - name: Show build errors
        if: failure()
        run: grep -E "error|undefined symbol" build.log | head -200 || true

      - name: Check it runs
        if: success()
        timeout-minutes: 15
        run: |
          cd build/web/site
          python3 -m http.server 8000 > /dev/null 2>&1 &
          cd "$GITHUB_WORKSPACE"
          npm install --no-save playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          timeout 600 node tools/web/smoke_test.js http://localhost:8000/ screenshots || echo "smoke test stopped ($?)"

      - name: Save screenshots (and the built site) to the web-screenshots branch
        if: always()
        run: |
          sha=$(git rev-parse --short HEAD)
          rm -rf /tmp/shots && mkdir -p /tmp/shots && cd /tmp/shots
          git init -q && git checkout -q -b web-screenshots
          cp -r "$GITHUB_WORKSPACE/screenshots" . 2>/dev/null || mkdir screenshots
          grep -E "error|warning: incompatible|undefined symbol" "$GITHUB_WORKSPACE/build.log" | head -300 > build-errors.txt || true
          if [ -d "$GITHUB_WORKSPACE/build/web/site" ]; then cp -r "$GITHUB_WORKSPACE/build/web/site" site; fi
          git add -A
          git -c user.name="web build" -c user.email="actions@users.noreply.github.com" commit -qm "Screenshots of ${sha}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web-screenshots

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
