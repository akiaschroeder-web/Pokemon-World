name: Build ROM

# Builds the Emerald ROM and attaches it to the run, so the game can be tested
# without a computer. Builds take a while, so they only run when asked:
#   - a pushed commit whose message contains [build], or
#   - "Run workflow" on the Actions tab (pick the branch).
# Download the ROM from the run's "Artifacts" section on GitHub (in a browser; the GitHub mobile app doesn't show artifacts).
# The ROM is uploaded unzipped, so it downloads as a plain .gba file.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    if: >-
      github.actor != 'allcontributors[bot]' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O all

      - name: Show how much of the 32 MB ROM is used
        run: |
          arm-none-eabi-size pokeemerald.elf || true
          echo "Largest pieces of the ROM (bytes, name):"
          arm-none-eabi-nm --size-sort -S pokeemerald.elf | awk '$3 ~ /[TtRrDd]/ {print strtonum("0x"$2), $4}' | sort -rn | head -60 || true
          echo "ROM bytes by source folder:"
          arm-none-eabi-nm -S -l pokeemerald.elf 2>/dev/null | awk 'NF>=5 && $3 ~ /[TtRrDd]/ {split($5,a,":"); f=a[1]; sub("^.*/pokemon-world/","",f); sub("^.*/Pokemon-World/","",f); n=split(f,p,"/"); key=p[1]"/"p[2]; s[key]+=strtonum("0x"$2)} END {for (k in s) print s[k], k}' | sort -rn | head -40 || true

      - name: Name the ROM after the branch and commit
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          mv pokeemerald.gba "pokemon-world-${branch}-${GITHUB_SHA::7}.gba"

      - name: Upload ROM
        uses: actions/upload-artifact@v7
        with:
          path: pokemon-world-*.gba
          archive: false
          retention-days: 14
          if-no-files-found: error
